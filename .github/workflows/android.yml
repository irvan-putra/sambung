name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: launcher icon is fresh
        run: |
          pip install pillow==12.3.0
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          python3 tools/badge_icon.py "$VER"
          git diff --exit-code -- android/app/src/main/res || { echo "launcher icon is stale; run: python3 tools/badge_icon.py $VER and commit"; exit 1; }
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sambung-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
